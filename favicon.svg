<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b365d"/>
      <stop offset="100%" stop-color="#0f2038"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Graduation Cap Top -->
  <polygon points="32,13 54,22 32,31 10,22" fill="#38bdf8"/>
  <polygon points="32,14 51,22 32,30 13,22" fill="#60a5fa"/>
  
  <!-- Graduation Cap Base & Tassel -->
  <path d="M19,27 L19,37 C19,43 45,43 45,37 L45,27" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M49,23 L49,34" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="49" cy="35" r="2" fill="#fbbf24"/>

  <!-- Attendance Verified Check Circle Badge -->
  <circle cx="45" cy="45" r="14" fill="#ffffff"/>
  <circle cx="45" cy="45" r="12" fill="url(#checkGrad)"/>
  <polyline points="39,45 43,49 51,41" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
